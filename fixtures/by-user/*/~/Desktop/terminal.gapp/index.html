<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    background: #0f1117;
    color: #d6deeb;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
  }
  #output {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    padding: 10px;
    border: 1px solid #2a3142;
    border-radius: 6px;
    background: #151922;
  }
  .line-prompt { color: #7fdbca; }
  .line-error { color: #ff6b6b; }
  .line-muted { color: #6b7a99; }
  #form {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
  }
  #prompt-label {
    color: #7fdbca;
    padding-top: 7px;
    flex: 0 0 auto;
  }
  #command {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    color: #d6deeb;
    background: #151922;
    border: 1px solid #2a3142;
    border-radius: 6px;
    padding: 6px 10px;
    outline: none;
  }
  #command:focus { border-color: #5c7cfa; }
</style>
</head>
<body>

<div id="output" aria-live="polite"></div>
<form id="form" autocomplete="off">
  <span id="prompt-label"></span>
  <input id="command" type="text" spellcheck="false" autocomplete="off" aria-label="Command">
</form>

<script type="module">
import { Shell } from './shell.js'

const $output = document.getElementById('output')
const $form = document.getElementById('form')
const $command = document.getElementById('command')
const $promptLabel = document.getElementById('prompt-label')

const shell = new Shell()

function appendLine(text, className = '') {
  const line = document.createElement('div')
  if (className) line.className = className
  line.textContent = text
  $output.appendChild(line)
  $output.scrollTop = $output.scrollHeight
}

function appendBlock(text, className = '') {
  if (!text) return
  for (const part of text.split('\n')) appendLine(part, className)
}

function updatePrompt() {
  $promptLabel.textContent = `${shell.cwdPath}$ `
}

async function boot() {
  try {
    await shell.init()
    appendLine(`cwd: ${shell.cwdPath} — a little Nushell-style shell; type "help"`, 'line-muted')
    updatePrompt()
    $command.focus()
  } catch (err) {
    appendLine(err instanceof Error ? err.message : 'Failed to initialize', 'line-error')
  }
}

$form.addEventListener('submit', async (event) => {
  event.preventDefault()
  const line = $command.value
  $command.value = ''

  appendLine(`${shell.cwdPath}$ ${line}`, 'line-prompt')

  if (!shell.ready) {
    appendLine('Shell not ready yet', 'line-error')
    return
  }

  try {
    const { output, clear } = await shell.run(line)
    if (clear) $output.replaceChildren()
    appendBlock(output)
    updatePrompt()
  } catch (err) {
    appendLine(err instanceof Error ? err.message : 'Command failed', 'line-error')
  }
})

window.addEventListener('message', (event) => {
  const type = event.data?.type
  if (type === 'init' || type === 'init:fresh') {
    $output.replaceChildren()
    void boot()
  }
})

appendLine('GlobalOS shell — Nushell-style, type "help" to learn', 'line-muted')
void boot()
window.parent.postMessage({ type: 'ready' }, '*')
</script>
</body>
</html>
